<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="product-card">
            <div class="product-card__image">
                <img src="images/product.jpg" alt="Товар">
            </div>
            <h2 class="product-card__title">Смартфон SuperPhone 15</h2>
            <p class="product-card__description">
                Суперсовременный смартфон с отличной камерой, 
                мощным процессором и большим сроком службы батареи.
            </p>
            <div class="product-card__footer">
                <span class="product-card__price">79 990 ₽</span>
                <button class="product-card__button">В корзину</button>
            </div>
        </div>
    </div>
</body>
</html>
